name: Build AAB
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build with Buildozer
        uses: ArtemSerebriennikov/buildozer-action@v1
        with:
          command: buildozer android release
      - name: Upload AAB
        uses: actions/upload-artifact@v2
        with:
          name: app-release
          path: bin/*.aab
